; inktide on M5Stack Core (Basic / Gray / Fire): ESP32, 320x240.
; M5Unified needs a large app partition on the 4MB modules.

[env:m5stack-core]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
build_flags =
    -Wall
    -Wno-unused-function
